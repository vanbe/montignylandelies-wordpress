# Redirects vers le domaine canonique
# montignylandelies.be, ensemble.* → www.montignylandelies.be
# Note : montigny.be et www.montigny.be sont redirigés directement par HAProxy (jamais transmis ici)
server {
    listen 80;
    server_name montignylandelies.be ensemble.montignylandelies.be ensemble.montigny.be;
    return 301 $scheme://www.montignylandelies.be$request_uri;
}

# Site principal
server {
    listen 80;
    server_name www.montignylandelies.be;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 500M;

    # Header de traçabilité — à retirer après décommissionnement de web01
    add_header X-Served-By "dockervanbe-docker" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|svg)$ {
        expires max;
        log_not_found off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}
